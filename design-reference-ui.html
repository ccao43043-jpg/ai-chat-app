<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat · 文字生成 & 插件</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    .message-enter { animation: fadeInUp 0.3s ease-out; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    .plugin-card { transition: all 0.2s; }
    .plugin-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen overflow-hidden">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-zinc-900/90 border-r border-zinc-800 flex flex-col hidden md:flex">
      <div class="p-4">
        <button id="newChatBtn" class="w-full flex items-center gap-2 px-4 py-3 bg-white text-black rounded-xl font-medium hover:bg-zinc-100 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          新对话
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-3 space-y-1">
        <div class="text-xs text-zinc-500 px-3 py-2">今天</div>
        <div class="px-3 py-2 rounded-lg bg-zinc-800 text-sm cursor-pointer">如何优化产品文案？</div>
        <div class="px-3 py-2 rounded-lg text-sm cursor-pointer hover:bg-zinc-800">代码审查建议</div>
        <div class="px-3 py-2 rounded-lg text-sm cursor-pointer hover:bg-zinc-800">旅行计划生成</div>
        <div class="text-xs text-zinc-500 px-3 py-2 mt-4">昨天</div>
        <div class="px-3 py-2 rounded-lg text-sm cursor-pointer hover:bg-zinc-800">解释 Transformer</div>
      </div>
      <div class="p-4 border-t border-zinc-800">
        <button id="openSettings" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-zinc-800 transition text-sm">
          <i data-lucide="settings" class="w-4 h-4"></i>
          设置
        </button>
        <button id="openPlugins" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-zinc-800 transition text-sm mt-1">
          <i data-lucide="puzzle" class="w-4 h-4"></i>
          插件
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
      <!-- Header -->
      <header class="h-14 border-b border-zinc-800 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="font-semibold">AI Chat</div>
            <div class="text-xs text-zinc-500">文字生成 · 多模型</div>
          </div>
        </div>
        <div class="flex items-center gap-2 text-zinc-400">
          <span class="text-xs bg-zinc-800 px-2 py-1 rounded-full">GPT-4o</span>
          <button class="p-2 hover:bg-zinc-800 rounded-lg"><i data-lucide="share" class="w-4 h-4"></i></button>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages" class="flex-1 overflow-y-auto px-4 py-6">
        <div class="max-w-3xl mx-auto">
          <div class="text-center py-16">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-600/20 to-fuchsia-600/20 border border-violet-500/30 mb-4">
              <i data-lucide="sparkles" class="w-8 h-8 text-violet-400"></i>
            </div>
            <h1 class="text-2xl font-semibold mb-2">你好，我是 AI Chat</h1>
            <p class="text-zinc-400">专注高质量文字生成。支持插件扩展能力。</p>
            <div class="flex flex-wrap justify-center gap-2 mt-6">
              <button class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm">写一份周报</button>
              <button class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm">解释这段代码</button>
              <button class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-full text-sm">翻译成英文</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="border-t border-zinc-800 p-4">
        <div class="max-w-3xl mx-auto">
          <div class="flex gap-2 mb-2 text-xs text-zinc-500">
            <span class="flex items-center gap-1 bg-zinc-800 px-2 py-1 rounded-full"><i data-lucide="globe" class="w-3 h-3"></i> 联网搜索</span>
            <span class="flex items-center gap-1 bg-zinc-800 px-2 py-1 rounded-full"><i data-lucide="code" class="w-3 h-3"></i> 代码解释器</span>
          </div>
          <form id="chatForm" class="relative">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="输入消息... (Shift + Enter 换行)"
              class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl pl-4 pr-14 py-4 text-sm resize-none focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/50 placeholder-zinc-500"
              style="max-height: 180px;"
            ></textarea>
            <button type="submit" id="sendBtn" class="absolute right-3 bottom-3 p-2 bg-violet-600 hover:bg-violet-500 rounded-xl transition disabled:opacity-40">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>
          <p class="text-xs text-zinc-600 text-center mt-2">AI 可能会犯错。请核实重要信息。</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg mx-4 max-h-[80vh] overflow-y-auto">
      <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
        <h2 class="text-lg font-semibold">设置</h2>
        <button id="closeSettings" class="p-1 hover:bg-zinc-800 rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-6 space-y-6">
        <div>
          <label class="block text-sm font-medium mb-2">API 配置</label>
          <input type="text" placeholder="API Base URL" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 mb-2 text-sm">
          <input type="password" placeholder="API Key" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">默认模型</label>
          <select class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
            <option>GPT-4o</option>
            <option>Claude 3.5 Sonnet</option>
            <option>DeepSeek-V3</option>
            <option>Gemini 2.0</option>
            <option>Kimi</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">主题</label>
          <div class="flex gap-2">
            <button class="px-4 py-2 bg-violet-600 rounded-lg text-sm">深色</button>
            <button class="px-4 py-2 bg-zinc-800 rounded-lg text-sm">浅色</button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">其他</label>
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked class="rounded"> 流式输出</label>
          <label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" checked class="rounded"> Markdown 渲染</label>
        </div>
      </div>
    </div>
  </div>

  <!-- Plugins Modal -->
  <div id="pluginsModal" class="fixed inset-0 modal-overlay hidden items-center justify-center z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-2xl mx-4 max-h-[80vh] overflow-y-auto">
      <div class="p-6 border-b border-zinc-800 flex justify-between items-center">
        <h2 class="text-lg font-semibold">插件</h2>
        <button id="closePlugins" class="p-1 hover:bg-zinc-800 rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-6">
        <p class="text-sm text-zinc-400 mb-4">启用插件扩展 AI 能力（参考主流产品设计）</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="plugin-card bg-zinc-800/50 border border-zinc-700 rounded-xl p-4">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600/20 rounded-lg flex items-center justify-center"><i data-lucide="globe" class="w-5 h-5 text-blue-400"></i></div>
                <div>
                  <div class="font-medium">联网搜索</div>
                  <div class="text-xs text-zinc-500">实时获取最新信息</div>
                </div>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" checked class="sr-only peer">
                <div class="w-9 h-5 bg-zinc-700 rounded-full peer peer-checked:bg-violet-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
              </label>
            </div>
          </div>
          <div class="plugin-card bg-zinc-800/50 border border-zinc-700 rounded-xl p-4">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-600/20 rounded-lg flex items-center justify-center"><i data-lucide="code" class="w-5 h-5 text-emerald-400"></i></div>
                <div>
                  <div class="font-medium">代码解释器</div>
                  <div class="text-xs text-zinc-500">执行与分析代码</div>
                </div>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" checked class="sr-only peer">
                <div class="w-9 h-5 bg-zinc-700 rounded-full peer peer-checked:bg-violet-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
              </label>
            </div>
          </div>
          <div class="plugin-card bg-zinc-800/50 border border-zinc-700 rounded-xl p-4">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-fuchsia-600/20 rounded-lg flex items-center justify-center"><i data-lucide="image" class="w-5 h-5 text-fuchsia-400"></i></div>
                <div>
                  <div class="font-medium">图片生成</div>
                  <div class="text-xs text-zinc-500">根据文字生成图片</div>
                </div>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer">
                <div class="w-9 h-5 bg-zinc-700 rounded-full peer peer-checked:bg-violet-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
              </label>
            </div>
          </div>
          <div class="plugin-card bg-zinc-800/50 border border-zinc-700 rounded-xl p-4">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-600/20 rounded-lg flex items-center justify-center"><i data-lucide="file-text" class="w-5 h-5 text-amber-400"></i></div>
                <div>
                  <div class="font-medium">文档解析</div>
                  <div class="text-xs text-zinc-500">上传 PDF/Word 分析</div>
                </div>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer">
                <div class="w-9 h-5 bg-zinc-700 rounded-full peer peer-checked:bg-violet-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // Modals
    document.getElementById('openSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
    document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.add('hidden');
    document.getElementById('openPlugins').onclick = () => document.getElementById('pluginsModal').classList.remove('hidden');
    document.getElementById('closePlugins').onclick = () => document.getElementById('pluginsModal').classList.add('hidden');

    // Close on overlay click
    document.getElementById('settingsModal').onclick = (e) => { if (e.target.id === 'settingsModal') e.currentTarget.classList.add('hidden'); };
    document.getElementById('pluginsModal').onclick = (e) => { if (e.target.id === 'pluginsModal') e.currentTarget.classList.add('hidden'); };

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      sendBtn.disabled = !input.value.trim();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addUserMessage(text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const typing = showTyping();
      await new Promise(r => setTimeout(r, 800));
      removeTyping(typing);
      addAIMessage("好的，我已收到你的消息。这是一个专注于文字生成的 AI Chat 界面，支持通过插件扩展联网搜索、代码执行等能力。需要我帮你完成什么任务？");
    });

    function getContainer() { return messagesEl.querySelector('.max-w-3xl') || messagesEl; }

    function addUserMessage(text) {
      const el = document.createElement('div');
      el.className = 'max-w-3xl mx-auto flex justify-end mb-6 message-enter';
      el.innerHTML = `<div class="bg-violet-600 rounded-2xl rounded-tr-md px-4 py-3 max-w-[85%]"><p class="whitespace-pre-wrap">${escapeHtml(text)}</p></div>`;
      getContainer().appendChild(el);
      scrollToBottom();
    }

    function addAIMessage(text) {
      const el = document.createElement('div');
      el.className = 'max-w-3xl mx-auto flex gap-4 mb-6 message-enter';
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center shrink-0">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <div class="bg-zinc-800/60 rounded-2xl rounded-tl-md px-4 py-3 max-w-[85%]">
          <p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(text)}</p>
        </div>`;
      getContainer().appendChild(el);
      lucide.createIcons();
      scrollToBottom();
    }

    function showTyping() {
      const id = 't-' + Date.now();
      const el = document.createElement('div');
      el.id = id;
      el.className = 'max-w-3xl mx-auto flex gap-4 mb-6';
      el.innerHTML = `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center"><i data-lucide="sparkles" class="w-4 h-4"></i></div><div class="bg-zinc-800/60 rounded-2xl px-4 py-3"><div class="flex gap-1"><div class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce"></div><div class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.1s"></div><div class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.2s"></div></div></div>`;
      getContainer().appendChild(el);
      lucide.createIcons();
      scrollToBottom();
      return id;
    }
    function removeTyping(id) { document.getElementById(id)?.remove(); }
    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    document.getElementById('newChatBtn').onclick = () => {
      getContainer().innerHTML = `<div class="text-center py-16"><div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-600/20 to-fuchsia-600/20 border border-violet-500/30 mb-4"><i data-lucide="sparkles" class="w-8 h-8 text-violet-400"></i></div><h1 class="text-2xl font-semibold mb-2">新的对话</h1><p class="text-zinc-400">开始一段全新的文字生成吧</p></div>`;
      lucide.createIcons();
    };

    sendBtn.disabled = true;
  </script>
</body>
</html>
