name: test
# 旧 JS（WebView 产品）的测试套件：测的是 www/ + Gradle 的 v0.x 发布线。
#
# 原生 v1 线把 Gradle versionName 改成了 1.0.0-alpha1，而 package.json 还停在 0.28.7，
# 两条发布线并行期间 tests/version-sync.test.js 与 tests/v017.test.js:279 都会断言
# "Gradle versionName === package.json.version"，在 native/* 上必红——与改动内容无关。
# 因此这套测试只在 main（旧 JS 产品线）上跑；原生分支由 android.yml + golden 负责。
#
# 已知缺口：tests/boot-smoke.test.js 需要 puppeteer-core + Chrome，本 workflow 没有
# install 步骤，所以它在 CI 上一直是 "Cannot find module 'puppeteer-core'"。
# 需要浏览器冒烟时本地：npm i puppeteer-core && CHROME=/usr/bin/google-chrome npm test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
