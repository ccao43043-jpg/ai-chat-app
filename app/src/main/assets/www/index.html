<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI 聊天</title>
<link rel="stylesheet" href="lib/hl-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="lib/hl-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="对话列表">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="title-wrap" id="title-wrap">
      <div class="title" id="conv-title">新对话</div>
      <div class="subtitle" id="conv-model">选择模型 ▾</div>
    </div>
    <button class="icon-btn" id="btn-new" aria-label="新对话">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="messages"></main>

  <footer class="composer">
    <div id="attach-preview" class="attach-preview"></div>
    <div class="composer-row">
      <button class="icon-btn small" id="btn-attach" aria-label="添加图片" title="添加图片（视觉模型）">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      </button>
      <button class="icon-btn small" id="btn-imagegen" aria-label="图片生成模式" title="图片生成模式">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
      <button class="send-btn" id="btn-send" aria-label="发送">
        <svg class="ic-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <svg class="ic-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
  </footer>
</div>

<!-- 侧边栏 -->
<div id="drawer-mask" class="mask"></div>
<aside id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">AI 聊天</div>
    <button class="pill-btn" id="drawer-new">＋ 新对话</button>
  </div>
  <div id="conv-list"></div>
  <div class="drawer-foot">
    <button class="row-btn" id="btn-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      设置 / API Key
    </button>
  </div>
</aside>

<!-- 设置页 -->
<section id="page-settings" class="page">
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="title-wrap"><div class="title">设置</div></div>
    <span class="icon-btn"></span>
  </header>
  <div class="page-body">
    <div class="section-title">服务商与 API Key</div>
    <div class="hint">API Key 只保存在本机应用私有存储中，请求直接从手机发往对应服务商，不经过任何第三方服务器。</div>
    <div id="provider-list" class="card-list"></div>
    <button class="pill-btn wide" id="btn-add-provider">＋ 添加服务商（OpenAI 兼容 / Claude / Gemini）</button>

    <div class="section-title">通用</div>
    <div class="card">
      <label class="field"><span>默认系统提示词（新对话使用）</span>
        <textarea id="set-system" rows="3" placeholder="例如：你是一个乐于助人的助手，请用中文回答。"></textarea></label>
      <label class="field inline"><span>流式输出</span><input type="checkbox" id="set-stream" class="switch"></label>
      <label class="field"><span>温度 temperature（留空 = 服务商默认）</span>
        <input id="set-temp" type="number" step="0.1" min="0" max="2" placeholder="如 0.7"></label>
      <label class="field"><span>最大输出 tokens（Claude 必填，其它留空 = 默认）</span>
        <input id="set-maxtokens" type="number" step="1" min="1" placeholder="4096"></label>
      <label class="field"><span>生成图片尺寸</span>
        <input id="set-imgsize" placeholder="1024x1024"></label>
    </div>
    <div class="section-title">数据</div>
    <div class="card">
      <button class="row-btn danger" id="btn-clear-all">删除全部对话</button>
    </div>
    <div class="about">AI 聊天 v0.1.0 · 数据仅存储在本机</div>
  </div>
</section>

<!-- 服务商编辑页 -->
<section id="page-provider" class="page">
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="title-wrap"><div class="title" id="pe-title">编辑服务商</div></div>
    <span class="icon-btn"></span>
  </header>
  <div class="page-body">
    <div class="card">
      <label class="field"><span>名称</span><input id="pe-name"></label>
      <label class="field"><span>接口类型</span>
        <select id="pe-type">
          <option value="openai">OpenAI 兼容（/chat/completions）</option>
          <option value="anthropic">Anthropic Claude（/v1/messages）</option>
          <option value="gemini">Google Gemini（generateContent）</option>
        </select></label>
      <label class="field"><span>Base URL</span><input id="pe-base" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <div class="hint small" id="pe-base-hint"></div>
      <label class="field"><span>API Key</span>
        <div class="input-row"><input id="pe-key" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-..."><button class="pill-btn" id="pe-key-toggle" type="button">显示</button></div></label>
      <label class="field"><span>模型列表（每行一个，第一个为默认）</span>
        <textarea id="pe-models" rows="4" autocapitalize="off" spellcheck="false"></textarea></label>
      <label class="field"><span>图片生成模型（可选，仅 OpenAI 兼容）</span>
        <input id="pe-imgmodel" autocapitalize="off" spellcheck="false" placeholder="如 gpt-image-1 / dall-e-3 / cogview-3-flash"></label>
    </div>
    <div class="btn-row">
      <button class="pill-btn danger" id="pe-delete">删除</button>
      <button class="pill-btn primary" id="pe-save">保存</button>
    </div>
  </div>
</section>

<!-- 模型选择面板 -->
<div id="sheet-mask" class="mask"></div>
<div id="sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">本对话的模型</div>
  <div id="sheet-providers" class="chip-row wrap"></div>
  <label class="field"><span>模型名称（可直接编辑）</span>
    <input id="sheet-model" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <div id="sheet-models" class="chip-row wrap"></div>
  <label class="field"><span>系统提示词（仅本对话）</span>
    <textarea id="sheet-system" rows="3" placeholder="可选"></textarea></label>
  <div class="btn-row">
    <button class="pill-btn" id="sheet-cancel">取消</button>
    <button class="pill-btn primary" id="sheet-ok">确定</button>
  </div>
</div>

<!-- 通用弹窗 -->
<div id="dialog-mask" class="mask center">
  <div class="dialog">
    <div class="dialog-title" id="dialog-title"></div>
    <div class="dialog-body" id="dialog-body"></div>
    <input id="dialog-input">
    <div class="btn-row">
      <button class="pill-btn" id="dialog-cancel">取消</button>
      <button class="pill-btn primary" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<!-- 图片查看 -->
<div id="viewer" class="viewer">
  <img id="viewer-img" alt="">
  <div class="viewer-bar">
    <button class="pill-btn" id="viewer-close">关闭</button>
    <button class="pill-btn primary" id="viewer-save">保存到相册</button>
  </div>
</div>

<div id="toast"></div>

<script src="lib/marked.umd.js"></script>
<script src="lib/purify.min.js"></script>
<script src="lib/highlight.min.js"></script>
<script src="providers.js"></script>
<script src="app.js"></script>
</body>
</html>
