<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI Chat</title>
<link rel="stylesheet" href="lib/hl-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="lib/hl-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar main-top">
    <button class="icon-btn" id="btn-menu" aria-label="对话列表">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    </button>
    <button class="model-pill" id="model-pill" aria-label="切换模型">
      <span class="mp-dot" id="mp-dot"></span>
      <span class="mp-text"><span class="mp-model" id="mp-model">选择模型</span><span class="mp-provider" id="mp-provider">点此切换</span></span>
      <svg class="mp-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
    </button>
    <button class="icon-btn" id="btn-new" aria-label="新对话">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </header>

  <main id="messages"></main>

  <footer class="composer">
    <div class="composer-card" id="composer-card">
      <div id="attach-preview" class="attach-preview"></div>
      <textarea id="input" rows="1" placeholder="给 AI 发消息…"></textarea>
      <div class="composer-tools">
        <button class="tool-btn" id="btn-attach" aria-label="添加图片">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="9" cy="10" r="1.8"/><path d="M21 15.5l-4.5-4.5L8 19.5"/></svg>
        </button>
        <button class="tool-chip" id="btn-imagegen" aria-label="图片生成模式">
          <svg viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 1.9 5.5 6 6.3-4.1.8-5.4 2.1-6 6.3-.6-4.2-1.9-5.5-6-6.3 4.1-.8 5.4-2.1 6-6.3z"/><path d="M18.5 15.5c.25 1.6.75 2.1 2.3 2.4-1.55.3-2.05.8-2.3 2.4-.25-1.6-.75-2.1-2.3-2.4 1.55-.3 2.05-.8 2.3-2.4z"/></svg>
          <span>生图</span>
        </button>
        <span class="spacer"></span>
        <button class="send-btn" id="btn-send" aria-label="发送" disabled>
          <svg class="ic-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          <svg class="ic-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
        </button>
      </div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
  </footer>
</div>

<!-- 模型快速切换菜单 -->
<div id="menu-mask" class="mask clear"></div>
<div id="model-menu" class="popover"></div>

<!-- 侧边栏 -->
<div id="drawer-mask" class="mask"></div>
<aside id="drawer">
  <div class="drawer-head">
    <img class="brand-logo" src="logo.svg" alt="">
    <div class="brand-name">AI Chat</div>
  </div>
  <div class="drawer-tools">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      <input id="conv-search" placeholder="搜索对话">
    </div>
    <button class="new-chat-btn" id="drawer-new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新对话
    </button>
  </div>
  <div id="conv-list"></div>
  <div class="drawer-foot">
    <button class="row-btn" id="btn-settings">
      <span class="row-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>
      <span class="row-text"><span>设置</span><small>服务商、API Key 与偏好</small></span>
    </button>
  </div>
</aside>

<!-- 设置页 -->
<section id="page-settings" class="page">
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="page-title">设置</div>
    <span class="icon-btn ghost"></span>
  </header>
  <div class="page-body">
    <div class="group-title">服务商</div>
    <div class="hint">API Key 仅保存在本机，请求由手机直接发往服务商，不经过任何中转服务器。</div>
    <div id="provider-list" class="group"></div>
    <button class="ghost-btn" id="btn-add-provider">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加自定义服务商
    </button>

    <div class="group-title">对话</div>
    <div class="group form">
      <label class="field"><span>默认系统提示词</span>
        <textarea id="set-system" rows="3" placeholder="例如：你是一个乐于助人的助手，请用中文回答。"></textarea></label>
      <label class="field inline"><span>流式输出<small>边生成边显示</small></span><input type="checkbox" id="set-stream" class="switch"></label>
      <div class="field-row">
        <label class="field"><span>温度</span><input id="set-temp" type="number" inputmode="decimal" step="0.1" min="0" max="2" placeholder="默认"></label>
        <label class="field"><span>最大输出 tokens</span><input id="set-maxtokens" type="number" inputmode="numeric" step="1" min="1" placeholder="4096"></label>
      </div>
      <label class="field"><span>生成图片尺寸</span><input id="set-imgsize" placeholder="1024x1024"></label>
    </div>

    <div class="group-title">数据</div>
    <div class="group">
      <button class="row-btn danger" id="btn-clear-all">删除全部对话</button>
    </div>
    <div class="about"><img src="logo.svg" alt=""><div><b>AI Chat</b><br><small id="about-ver">v0.1.1 · 数据仅存储在本机</small></div></div>
  </div>
</section>

<!-- 服务商编辑页 -->
<section id="page-provider" class="page">
  <header class="topbar">
    <button class="icon-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="page-title" id="pe-title">编辑服务商</div>
    <button class="text-btn" id="pe-save">保存</button>
  </header>
  <div class="page-body">
    <div class="group form">
      <label class="field"><span>名称</span><input id="pe-name"></label>
      <label class="field"><span>接口类型</span>
        <select id="pe-type">
          <option value="openai">OpenAI 兼容（/chat/completions）</option>
          <option value="anthropic">Anthropic Claude（/v1/messages）</option>
          <option value="gemini">Google Gemini（generateContent）</option>
        </select></label>
      <label class="field"><span>Base URL</span><input id="pe-base" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <div class="hint small" id="pe-base-hint"></div>
      <label class="field"><span>API Key</span>
        <div class="input-row"><input id="pe-key" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-..."><button class="chip-btn" id="pe-key-toggle" type="button">显示</button></div></label>
    </div>
    <div class="group-title row">模型
      <button class="chip-btn accent" id="pe-fetch" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>从接口获取模型列表</button>
    </div>
    <div class="group form">
      <div id="pe-model-chips" class="model-chips"></div>
      <div class="input-row"><input id="pe-model-add" placeholder="输入模型名称后添加" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="chip-btn" id="pe-model-add-btn" type="button">添加</button></div>
      <div class="hint small" style="margin-top:8px">第一个为默认模型；点 × 删除，点模型名设为默认。</div>
      <label class="field" style="margin-top:6px"><span>图片生成模型（可选，仅 OpenAI 兼容）</span>
        <input id="pe-imgmodel" autocapitalize="off" spellcheck="false" placeholder="如 gpt-image-2.5-flare / cogview-3-flash"></label>
    </div>
    <button class="ghost-btn danger" id="pe-delete">删除此服务商</button>
  </div>
</section>

<!-- 获取模型列表结果 -->
<div id="fetch-mask" class="mask"></div>
<div id="fetch-sheet" class="sheet tall">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><div class="sheet-title">选择要添加的模型</div><button class="text-btn" id="fetch-all">全选</button></div>
  <div class="search in-sheet">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    <input id="fetch-search" placeholder="筛选模型">
  </div>
  <div id="fetch-list" class="check-list"></div>
  <div class="btn-row">
    <button class="pill-btn" id="fetch-cancel">取消</button>
    <button class="pill-btn primary" id="fetch-ok">添加所选</button>
  </div>
</div>

<!-- 模型 / 系统提示词面板 -->
<div id="sheet-mask" class="mask"></div>
<div id="sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">模型与提示词</div>
  <div class="sheet-label">服务商</div>
  <div id="sheet-providers" class="chip-row wrap"></div>
  <label class="field"><span>模型名称（可直接编辑）</span>
    <input id="sheet-model" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <div id="sheet-models" class="chip-row wrap"></div>
  <label class="field"><span>系统提示词（仅本对话）</span>
    <textarea id="sheet-system" rows="3" placeholder="可选"></textarea></label>
  <div class="btn-row">
    <button class="pill-btn" id="sheet-cancel">取消</button>
    <button class="pill-btn primary" id="sheet-ok">确定</button>
  </div>
</div>

<!-- 操作菜单 -->
<div id="action-mask" class="mask"></div>
<div id="action-sheet" class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="action-title"></div>
  <div id="action-list"></div>
</div>

<!-- 通用弹窗 -->
<div id="dialog-mask" class="mask center">
  <div class="dialog">
    <div class="dialog-title" id="dialog-title"></div>
    <div class="dialog-body" id="dialog-body"></div>
    <input id="dialog-input">
    <div class="btn-row">
      <button class="pill-btn" id="dialog-cancel">取消</button>
      <button class="pill-btn primary" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<!-- 图片查看 -->
<div id="viewer" class="viewer">
  <img id="viewer-img" alt="">
  <div class="viewer-bar">
    <button class="pill-btn dark" id="viewer-close">关闭</button>
    <button class="pill-btn primary" id="viewer-save">保存到相册</button>
  </div>
</div>

<div id="toast"></div>

<script src="lib/marked.umd.js"></script>
<script src="lib/purify.min.js"></script>
<script src="lib/highlight.min.js"></script>
<script src="providers.js"></script>
<script src="app.js"></script>
</body>
</html>
