plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// 签名：根目录 keystore.properties（不提交 Git，见 .gitignore）存在时用它；否则回退 debug 证书。
// 覆盖安装要求证书 SHA-256 = 6054f9df…a360（~/.android/debug.keystore / androiddebugkey）。
def ksPropsFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) { ksPropsFile.withInputStream { ksProps.load(it) } }

android {
    namespace 'com.aichat.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aichat.app'   // 不可改：覆盖安装
        minSdk 24
        targetSdk 34
        versionCode 100                  // 原生 v1：> g胖 的 v0.29.0 (90)
        versionName '1.0.0-alpha1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
    testOptions { unitTests.returnDefaultValues = true }
    // 旧 WebView 前端（src/main/assets/www）只作 golden 对照与 node 测试的参考实现，不打进 APK
    sourceSets { main { assets.srcDirs = [] } }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // A 的 Compose UI 测试（整合者裁定 #e）
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
